# h2o for the response captures
listen:
  host: 127.0.0.1
  port: @PORT@
pid-file: @RUN@/h2o.pid
error-log: /dev/stderr
compress: ON
hosts:
  default:
    paths:
      /chunked:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/chunked
      /trailers:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/trailers
      /gzip:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/gzip
      /304:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/304
      /204:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/204
      /close:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/close
      /early:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/early
      /echo:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/echo
      /:
        file.dir: @DOCROOT@
