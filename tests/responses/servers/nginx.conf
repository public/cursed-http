# nginx for the response captures: static files, the dynamic paths proxied to the Python origin (ORIGIN_PORT)
worker_processes 1;
events { worker_connections 64; }
http {
  access_log off;
  include mime.types;
  gzip on;
  gzip_types text/plain text/html;
  gzip_min_length 100;
  server {
    listen 127.0.0.1:@PORT@;
    root @DOCROOT@;
    location = /204 { return 204; }
    location ~ ^/(chunked|trailers|gzip|304|close|early|echo)$ {
      proxy_pass http://127.0.0.1:@ORIGIN@;
      proxy_http_version 1.1;
    }
    location = /upgrade {
      proxy_pass http://127.0.0.1:@ORIGIN@;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
