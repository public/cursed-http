# HAProxy for the response captures: everything proxied to the Python origin
global
  maxconn 64
defaults
  mode http
  timeout connect 2s
  timeout client 5s
  timeout server 5s
  option http-keep-alive
frontend fe
  bind 127.0.0.1:@PORT@
  http-request return status 204 if { path /204 }
  default_backend be
backend be
  server origin 127.0.0.1:@ORIGIN@
