# h2o: h2c with prior knowledge on a plain listener
listen:
  host: 127.0.0.1
  port: @PORT@
listen: # HTTP/2 over TLS (ALPN h2)
  host: 127.0.0.1
  port: @PORTS@
  ssl:
    certificate-file: @RUN@/cert.pem
    key-file: @RUN@/key.pem
pid-file: @RUN@/h2o.pid
error-log: /dev/stderr
hosts:
  default:
    paths:
      /echo:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/echo
      /trailers:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/trailers
      /204:
        proxy.reverse.url: http://127.0.0.1:@ORIGIN@/204
      /:
        file.dir: @DOCROOT@
