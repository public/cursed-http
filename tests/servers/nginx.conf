# nginx: h2c with prior knowledge ("listen ... http2" without ssl)
worker_processes 1;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path @RUN@/nginx/body;
  proxy_temp_path @RUN@/nginx/proxy;
  fastcgi_temp_path @RUN@/nginx/fastcgi;
  uwsgi_temp_path @RUN@/nginx/uwsgi;
  scgi_temp_path @RUN@/nginx/scgi;
  client_max_body_size 10m;
  server {
    listen 127.0.0.1:@PORT@ http2;
    root @DOCROOT@;
    location = /204 { return 204; }
    location ~ ^/(echo|trailers)$ {
      proxy_pass http://127.0.0.1:@ORIGIN@;
      proxy_http_version 1.1;
    }
  }
  server { # HTTP/2 over TLS (ALPN h2)
    listen 127.0.0.1:@PORTS@ ssl http2;
    ssl_certificate @RUN@/cert.pem;
    ssl_certificate_key @RUN@/key.pem;
    root @DOCROOT@;
    location = /204 { return 204; }
    location ~ ^/(echo|trailers)$ {
      proxy_pass http://127.0.0.1:@ORIGIN@;
      proxy_http_version 1.1;
    }
  }
}
