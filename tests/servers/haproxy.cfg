# HAProxy: h2c with prior knowledge ("proto h2"), everything from the origin
global
  maxconn 64
defaults
  mode http
  timeout connect 2s
  timeout client 10s
  timeout server 10s
frontend fe
  bind 127.0.0.1:@PORT@ proto h2
  default_backend be
backend be
  server origin 127.0.0.1:@ORIGIN@ maxconn 16
